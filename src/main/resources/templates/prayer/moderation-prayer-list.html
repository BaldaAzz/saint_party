<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Action</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prayer : ${prayers}">
              <td th:text="${prayer.id}"></td>
              <td th:text="${prayer.title}"></td>
              <td>
                <a th:href="@{/moderation/prayers/{id}/edit(id=${prayer.getId()})}">Update</a>
              </td>
              <td>
                <a th:href="@{/moderation/prayers/{id}/delete(id=${prayer.getId()})}">Delete</a>
              </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
