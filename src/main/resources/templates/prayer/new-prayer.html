<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Сборник молитв</title>
<!--        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->
    </head>
    <body>
        <header class="mb-4" th:insert="blocks/header"></header>
        
        <h1>Сборник молитв</h1>

        <form th:action="@{/moderation/prayers}" th:object="${prayer}" method="post">
            <div class="row">

                <div class="col">
                    <div class="row mb-2">
                        <label class="col" for="title">Название</label>
                        <input class="col" id="title" th:field="${prayer.title}" placeholder="Название" type="text">
                        <span th:if="${#fields.hasErrors('title')}" th:errors="${prayer.title}"></span>
                    </div>
    
                    <div class="row mb-2">
                        <label>
                            <textarea th:field="${prayer.text}" placeholder="Текст молитвы"></textarea>
                        </label>
                        <span th:if="${#fields.hasErrors('text')}" th:errors="${prayer.text}"></span>
                    </div>
                </div>
            </div>
    
            <button class="btn btn-primary row" type="submit">Добавить</button>
        </form>

        <footer th:insert="blocks/footer"></footer>

<!--        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>-->
    </body>
</html>
