<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Обновить</title>
</head>
<body>

<form th:action="@{/moderation/biographies/update}" th:object="${biography}" method="post" enctype="multipart/form-data">
    <input type="hidden" th:field="${biography.id}">
    <input class="btn btn-primary" type="file" id="imageInput" name="imageInput" accept="image/*">
    <div class="row">
        <img class="col" id="preview" alt="Предпросмотр изображения" style="height: 100%;">

        <div class="col">
            <div class="row mb-2">
                <label class="col" for="name">Имя</label>
                <input class="col" id="name" th:field="${biography.name}" placeholder="Имя" type="text">
            </div>

            <div class="row mb-2">
                <label class="col" for="surName">Фамилия</label>
                <input class="col" id="surName" th:field="${biography.surname}" placeholder="Фамилия" type="text">
            </div>

            <div class="row mb-2">
                <label class="col" for="dateOfBirth">Дата рождения</label>
                <input class="col" id="dateOfBirth" th:field="${biography.dateOfBirth}" placeholder="Дата рождения" type="text">
            </div>

            <div class="row mb-2">
                <label class="col" for="placeOfBirth">Место рождения:</label>
                <input type="text" th:field="${biography.placeOfBirth}" id="placeOfBirth">
            </div>

            <div class="row mb-2">
                <label class="col" for="dateOfView">Дата представления</label>
                <input class="col" id="dateOfView" th:field="${biography.dateOfView}" placeholder="Дата представления" type="text">
            </div>

            <div class="row mb-2">
                <label class="col" for="placeOfView">Место представления</label>
                <input class="col" id="placeOfView" th:field="${biography.placeOfView}" placeholder="Место представления" type="text">
            </div>

            <div class="row mb-2">
                <label class="col" for="dateOfMemory">Дата памяти</label>
                <input class="col" id="dateOfMemory" th:field="${biography.dateOfMemory}" placeholder="Дата памяти" type="text">
            </div>

            <div class="row mb-2">
                <label>
                    <textarea th:field="${biography.text}" placeholder="Биография"></textarea>
                </label>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.src = event.target.result;
                    preview.style.display = 'block'; // Показываем изображение
                };
                reader.readAsDataURL(file);
            }
        });
    </script>





    <button class="btn btn-primary row" type="submit">Add</button>
</form>

</body>
</html>
